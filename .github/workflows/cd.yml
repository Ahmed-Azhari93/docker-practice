name: CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Show deployment version
        run: |
          echo "Deploying image:"
          echo "ghcr.io/ahmed-azhari93/docker-practice:${{ inputs.image_tag }}"
